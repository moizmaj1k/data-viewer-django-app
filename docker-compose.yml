version: "3.9"

services:
  web:
    build: .
    container_name: rams-web
    restart: always
    env_file:
      - .env
    volumes:
      # Share this named volume with nginx too
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    command: >
      gunicorn rams.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --limit-request-line 16384
      --limit-request-field_size 16384
    # no ports directly; nginx will expose 80/443
    depends_on: []

  nginx:
    image: nginx:1.27
    container_name: rams-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      # later: "443:443" when you add HTTPS
    volumes:
      # main nginx config
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

      # mount Let's Encrypt certs from host into container (read-only)
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # shared static volume
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  static_volume:
