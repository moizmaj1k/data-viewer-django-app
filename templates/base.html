<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Data Control{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/main.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="brand">Data Control</div>
    <nav class="toolbar">
      {% block toolbar %}{% endblock %}
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
