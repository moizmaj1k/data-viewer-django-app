user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream django_app {
        server web:8000;  # matches docker-compose service name
    }

    # --- HTTP: redirect everything to HTTPS ---
    server {
        listen 80;
        server_name datacollection.pavron.com.pk;

        # Allow only office network IPv4 + IPv6
        allow 206.84.143.0/24;
        allow 2407:d000:b:c5ad::/64;
        deny all;

        return 301 https://$host$request_uri;
    }

    # --- HTTPS: main app ---
    server {
        listen 443 ssl;
        server_name datacollection.pavron.com.pk;

        # Allow only office network IPv4 + IPv6
        allow 206.84.143.0/24;
        allow 2407:d000:b:c5ad::/64;
        deny all;

        ssl_certificate     /etc/letsencrypt/live/datacollection.pavron.com.pk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/datacollection.pavron.com.pk/privkey.pem;

        # (optional) modern SSL tweaks could go here later

        client_max_body_size 20M;

        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 30d;
        }

        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
