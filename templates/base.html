{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="shortcut icon" href="{% static 'favicon/layer-head.png' %}" type="image/png">
  <title>DCA Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{% static 'main.css' %}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <!-- Browser reload (no template tags needed) -->
  {% if debug %}
    <script
      src="{% static 'django-browser-reload/reload-listener.js' %}"
      data-workers-url="/__reload__/reload-worker.js"
      defer>
    </script>
  {% endif %}
  <header class="topbar">
    <div class="brand">
      <img src="{% static 'favicon/layer-head.png' %}" class="brand-icon" alt="Logo">
      Data Collection App - Dashboard
    </div>
    <nav class="toolbar">
      {% block toolbar %}{% endblock %}
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
